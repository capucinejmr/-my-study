<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffdfd">
<title>My Study</title>
<style>
:root{--ink:#29272d;--muted:#8d8992;--line:#eeeaf0;--bg:#fffdfd;--pink:#f4dce8;--lilac:#e9e2f5;--blue:#e0edf8;--green:#e3efe4;--peach:#f8e6db;--yellow:#f7efcf;--radius:20px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit}button{cursor:pointer}header{padding:25px 22px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:43px;height:43px;border:1px solid #e9dce6;border-radius:14px;display:grid;place-items:center;font-family:Georgia,serif;font-size:17px;letter-spacing:-2px;color:#9e7895;background:linear-gradient(135deg,#fff,#fbf1f6)}h1{font:500 24px Georgia,serif;margin:0;letter-spacing:.1px}.sub{font-size:12px;color:var(--muted);margin-top:4px}.date-chip{border:1px solid var(--line);border-radius:14px;padding:9px 12px;color:#77717c;font-size:12px;background:white}main{max-width:720px;margin:auto;padding:0 18px}.greeting{margin:12px 4px 22px}.eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#a18b9c;margin-bottom:8px}.greeting h2{font:500 27px Georgia,serif;margin:0 0 7px}.greeting p{margin:0;color:var(--muted);font-size:14px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}.section-title h3{font-size:15px;font-weight:600;margin:0}.tiny{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}.wide{grid-column:1/-1}.stat-label{font-size:12px;color:var(--muted);margin-bottom:10px}.stat-value{font:500 24px Georgia,serif}.stat-note{font-size:11px;color:#9b929c;margin-top:6px}.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:99px;background:#faf5f8;font-size:11px;color:#8c7187}.dot{width:7px;height:7px;border-radius:50%;background:#d7b5ce}.line{height:1px;background:var(--line);margin:14px 0}.empty{padding:18px 12px;text-align:center;color:#a29ba5;font-size:13px;border:1px dashed #e9e3eb;border-radius:15px}.btn{border:1px solid #eadde7;background:#fff7fb;color:#916e87;padding:10px 14px;border-radius:13px;font-size:13px;font-weight:600}.btn.primary{background:#f1e3ed;border-color:#ead4e4;color:#805f79}.btn.small{padding:7px 10px;font-size:12px}.list{display:flex;flex-direction:column;gap:9px}.item{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:15px;background:#fff}.check{appearance:none;width:19px;height:19px;border:1.5px solid #d7c8d5;border-radius:6px;flex-shrink:0;margin:1px 0 0;background:white}.check:checked{background:#d9c1d5;border-color:#d9c1d5;box-shadow:inset 0 0 0 4px white}.item-title{font-size:13px;font-weight:550;line-height:1.35}.item.done .item-title{text-decoration:line-through;color:#a39ca5}.item-meta{font-size:11px;color:var(--muted);margin-top:5px}.subject-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(255,253,253,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:9px 8px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}.nav button{border:0;background:transparent;color:#aaa2ad;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;min-width:55px;padding:4px}.nav button.active{color:#96748f}.nav .ico{font-size:20px;line-height:1.2}.page-head{padding:10px 3px 18px}.page-head h2{font:500 28px Georgia,serif;margin:0 0 6px}.page-head p{margin:0;font-size:13px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.field{display:flex;flex-direction:column;gap:6px;margin:11px 0}.field label{font-size:12px;color:#817984}.field input,.field select,.field textarea{width:100%;border:1px solid #e9e3eb;border-radius:12px;background:#fff;padding:11px 12px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#d5b9d1}.form-card{margin-top:14px}.hidden{display:none!important}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 8px}.filter{border:1px solid var(--line);background:white;border-radius:99px;padding:8px 12px;font-size:12px;color:#8b8490;white-space:nowrap}.filter.active{background:#f3e7f0;color:#876580;border-color:#ead8e7}.week{display:grid;grid-template-columns:repeat(7,minmax(38px,1fr));gap:5px;margin:14px 0}.day{border:1px solid var(--line);border-radius:12px;padding:9px 2px;text-align:center;background:#fff;font-size:11px;color:#8e8792}.day strong{display:block;font-size:15px;font-weight:500;color:var(--ink);margin-top:5px}.day.selected{background:#f5e9f1;border-color:#ead6e6}.soft{background:#fbf6fa}.metric{font:500 32px Georgia,serif}.muted{color:var(--muted)}.notice{font-size:12px;color:#938b96;line-height:1.5}.progress{height:6px;border-radius:99px;background:#f0ebf1;overflow:hidden;margin-top:12px}.progress span{display:block;height:100%;width:0;background:#d8bfd4;border-radius:99px;transition:width .2s}.modal-back{position:fixed;inset:0;background:#29232d55;display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:14px}.modal{background:#fffdfd;border-radius:24px 24px 18px 18px;padding:20px;width:100%;max-width:560px;max-height:88vh;overflow:auto}.modal-top{display:flex;justify-content:space-between;align-items:center}.modal h3{font:500 22px Georgia,serif;margin:0}.close{border:0;background:#f6f0f5;border-radius:50%;width:32px;height:32px;color:#8c7a8c}.modal-actions{display:flex;gap:9px;margin-top:16px}.modal-actions button{flex:1}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#3b3440;color:white;padding:10px 16px;border-radius:99px;font-size:12px;z-index:30;box-shadow:0 6px 20px #0002}

.week-switch{display:flex;gap:8px;margin:14px 0 8px}.week-switch button{flex:1;border:1px solid var(--line);border-radius:13px;background:white;padding:10px;color:#948a98;font-size:13px}.week-switch button.active{background:#f2e6f0;border-color:#e7d4e5;color:#896b86;font-weight:600}.week-caption{font-size:12px;color:var(--muted);margin:0 2px 14px}.schedule-days{display:flex;flex-direction:column;gap:12px}.schedule-day{border:1px solid var(--line);border-radius:18px;background:#fff;padding:14px}.schedule-day h3{font-size:14px;font-weight:600;margin:0 0 11px}.class-list{display:flex;flex-direction:column;gap:8px}.class-row{display:flex;gap:10px;align-items:stretch;border:1px solid #f0ebf1;border-radius:12px;overflow:hidden;background:#fff}.class-color{width:5px;flex-shrink:0}.class-time{width:82px;flex-shrink:0;padding:10px 0 10px 8px;font-size:11px;color:#8c8490;line-height:1.4}.class-info{padding:9px 8px 9px 0;min-width:0;flex:1}.class-name{font-size:13px;font-weight:550;line-height:1.35}.class-week{display:inline-block;margin-top:5px;padding:3px 7px;border-radius:99px;background:#f7f1f6;color:#9a7d95;font-size:10px}.schedule-empty{font-size:12px;color:#b0a8b2;padding:5px 2px}.home-class-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}.home-class-list .class-row{background:#fff}.home-class-list .class-time{width:72px}

@media(min-width:650px){main{padding:0 26px}.grid{gap:15px}.card{padding:19px}.greeting h2{font-size:32px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">MS</div><div><h1>My Study</h1><div class="sub">Ton espace, ton équilibre</div></div></div><div class="date-chip" id="dateChip">Aujourd’hui</div></header>
<main id="app"></main>
<nav class="nav" aria-label="Navigation principale">
<button class="active" data-tab="home"><span class="ico">⌂</span>Accueil</button>
<button data-tab="agenda"><span class="ico">▦</span>Agenda</button>
<button data-tab="cours"><span class="ico">▤</span>Cours</button>
<button data-tab="sport"><span class="ico">◉</span>Sport</button>
<button data-tab="sleep"><span class="ico">☾</span>Sommeil</button>
</nav>
<div id="modalRoot"></div>
<script>
const subjects=[['Anglais','#dcecf8'],['SNT','#e9e1f5'],['Physique-chimie','#f8e5d8'],['SVT','#e0eee2'],['Module choix orientation','#f4e2e8'],['Mathématiques','#e7e0f5'],['Espagnol','#f8e1dc'],['EPS','#f4dce8'],['Français','#f5e0eb'],['EMC','#f7efcf'],['Histoire-géographie','#e2e7f6'],['SES','#e2eee5']];
const defaultData={tasks:[],tests:[],events:[],sports:[],sleep:[],classes:[],tab:'home'};
let data;try{data={...defaultData,...JSON.parse(localStorage.getItem('mystudy-data')||'{}')}}catch(e){data={...defaultData}}
const save=()=>localStorage.setItem('mystudy-data',JSON.stringify(data));
const today=new Date();const dateFmt=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'});document.getElementById('dateChip').textContent=dateFmt.format(today);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateISO=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
// Semaine A de référence : lundi 23 novembre 2026 (semaine A confirmée par l'utilisatrice).
const weekAAnchor='2026-11-23';
function weekForDate(d){const monday=new Date(d);monday.setHours(12,0,0,0);monday.setDate(monday.getDate()-((monday.getDay()+6)%7));const anchor=new Date(weekAAnchor+'T12:00:00');const days=Math.round((monday-anchor)/86400000);return Math.floor(days/7)%2===0?'A':'B'}
let viewWeek=weekForDate(today);
const timetable=[
{day:0,start:'08:55',end:'10:00',subject:'AVS',week:'A'},
{day:0,start:'08:55',end:'10:00',subject:'Orientation',week:'B'},
{day:0,start:'10:00',end:'10:55',subject:'Anglais'},
{day:0,start:'10:55',end:'12:00',subject:'SNT'},
{day:0,start:'14:00',end:'16:00',subject:'Physique-chimie'},
{day:0,start:'16:00',end:'17:00',subject:'SVT'},
{day:1,start:'08:00',end:'08:55',subject:'Histoire-géo',week:'B'},
{day:1,start:'08:55',end:'10:55',subject:'Mathématiques'},
{day:1,start:'10:55',end:'12:00',subject:'Physique-chimie'},
{day:1,start:'15:00',end:'16:00',subject:'Espagnol'},
{day:1,start:'16:00',end:'18:00',subject:'EPS'},
{day:2,start:'08:00',end:'10:00',subject:'Français'},
{day:2,start:'10:00',end:'11:30',subject:'SES'},
{day:3,start:'08:00',end:'08:55',subject:'Histoire-géo',week:'B'},
{day:3,start:'08:55',end:'10:00',subject:'Français'},
{day:3,start:'10:00',end:'10:55',subject:'Anglais'},
{day:3,start:'13:00',end:'14:00',subject:'Espagnol',week:'B'},
{day:3,start:'14:00',end:'15:00',subject:'EMC',week:'A'},
{day:4,start:'08:00',end:'08:55',subject:'Histoire-géo',week:'B'},
{day:4,start:'08:55',end:'10:00',subject:'Histoire-géo'},
{day:4,start:'10:00',end:'10:55',subject:'Anglais'},
{day:4,start:'10:55',end:'12:00',subject:'Mathématiques'},
{day:4,start:'14:00',end:'15:00',subject:'Mathématiques',week:'B'},
{day:4,start:'15:00',end:'16:00',subject:'Français'},
{day:4,start:'16:00',end:'17:00',subject:'Espagnol'}
];
const dayNames=['Lundi','Mardi','Mercredi','Jeudi','Vendredi'];
const timetableFor=(day,week)=>timetable.filter(c=>c.day===day&&(!c.week||c.week===week)).sort((a,b)=>a.start.localeCompare(b.start));
function classColor(subject){return ({'AVS':'#e9dff2','Orientation':'#f3dfe9','Anglais':'#dcecf8','SNT':'#dff0e4','Physique-chimie':'#f8e5d8','Mathématiques':'#e7e0f5','Espagnol':'#dcefeb','EPS':'#f4dce8','Français':'#f5e0eb','EMC':'#f7efcf','Histoire-géo':'#e2e7f6','SES':'#e2eee5'})[subject]||'#e9e2f5'}
function classRow(c){return `<div class="class-row"><span class="class-color" style="background:${classColor(c.subject)}"></span><div class="class-time">${c.start}<br>– ${c.end}</div><div class="class-info"><div class="class-name">${esc(c.subject)}</div>${c.week?`<span class="class-week">Semaine ${c.week}</span>`:''}</div></div>`}
function todayClassesHTML(){const d=(today.getDay()+6)%7;if(d>4)return '<div class="empty">Pas de cours au lycée aujourd’hui. Profite de ta journée !</div>';const list=timetableFor(d,weekForDate(today));return list.length?`<div class="home-class-list">${list.map(classRow).join('')}</div>`:'<div class="empty">Aucun cours prévu aujourd’hui.</div>'}
const subjectColor=s=>(subjects.find(x=>x[0]===s)||['','#ddd'])[1];
const dueLabel=d=>d?new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short'}).format(new Date(d+'T12:00:00')):'Sans date';
function update(){save();render()}
function openModal(title,body,submitLabel='Enregistrer',onSubmit){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-back"><section class="modal"><div class="modal-top"><h3>${title}</h3><button class="close" aria-label="Fermer">×</button></div><form id="modalForm">${body}<div class="modal-actions"><button type="button" class="btn close2">Annuler</button><button class="btn primary" type="submit">${submitLabel}</button></div></form></section></div>`;root.querySelector('.close').onclick=root.querySelector('.close2').onclick=()=>root.innerHTML='';root.querySelector('.modal-back').addEventListener('click',e=>{if(e.target.classList.contains('modal-back'))root.innerHTML=''});root.querySelector('form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);onSubmit(fd);root.innerHTML='';update()}}
const subjSelect=(name='subject')=>`<div class="field"><label>Matière</label><select name="${name}" required><option value="">Choisir une matière</option>${subjects.map(s=>`<option>${esc(s[0])}</option>`).join('')}</select></div>`;
const field=(label,name,type='text',extra='')=>`<div class="field"><label>${label}</label><input name="${name}" type="${type}" ${extra} required></div>`;
function addTask(){openModal('Nouveau devoir',subjSelect()+field('Titre du devoir','title')+field('Date de rendu','due','date')+field('Temps estimé (minutes)','mins','number','min="5" step="5"')+`<div class="field"><label>Priorité</label><select name="priority"><option>Normale</option><option>Faible</option><option>Urgente</option></select></div>`,'Ajouter',fd=>data.tasks.push({id:Date.now(),subject:fd.get('subject'),title:fd.get('title'),due:fd.get('due'),mins:+fd.get('mins')||30,priority:fd.get('priority'),done:false}))}
function addTest(){openModal('Nouveau contrôle',subjSelect()+field('Titre / chapitre','title')+field('Date du contrôle','date','date'),'Ajouter',fd=>data.tests.push({id:Date.now(),subject:fd.get('subject'),title:fd.get('title'),date:fd.get('date'),grade:null,coef:1}))}
function addEvent(){openModal('Nouvel événement',field('Nom de l’événement','title')+field('Date','date','date')+field('Début','start','time')+field('Fin','end','time')+`<div class="field"><label>Type</label><select name="type"><option>Personnel</option><option>Rendez-vous</option><option>École</option><option>Basket</option></select></div>`,'Ajouter',fd=>data.events.push({id:Date.now(),title:fd.get('title'),date:fd.get('date'),start:fd.get('start'),end:fd.get('end'),type:fd.get('type')}))}
function addSport(){openModal('Séance de sport',field('Séance / entraînement','title')+field('Date','date','date')+field('Heure','time','time')+field('Durée (minutes)','mins','number','min="5" step="5"'),'Ajouter',fd=>data.sports.push({id:Date.now(),title:fd.get('title'),date:fd.get('date'),time:fd.get('time'),mins:+fd.get('mins')||90,done:false}))}
function addSleep(){openModal('Noter mon sommeil',field('Je me suis couchée à','bed','time')+field('Je me suis réveillée à','wake','time')+`<div class="field"><label>Date du réveil</label><input name="date" type="date" value="${dateISO(today)}" required></div>`,'Enregistrer',fd=>{let [bh,bm]=fd.get('bed').split(':').map(Number),[wh,wm]=fd.get('wake').split(':').map(Number);let mins=(wh*60+wm)-(bh*60+bm);if(mins<=0)mins+=1440;data.sleep.unshift({id:Date.now(),date:fd.get('date'),bed:fd.get('bed'),wake:fd.get('wake'),mins})})}
function duration(m){return `${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`}
function itemTask(t){return `<div class="item ${t.done?'done':''}"><input class="check" type="checkbox" data-task="${t.id}" ${t.done?'checked':''}><div style="flex:1"><div class="item-title"><span class="subject-dot" style="background:${subjectColor(t.subject)}"></span>${esc(t.title)}</div><div class="item-meta">${esc(t.subject)} · ${dueLabel(t.due)} · ${t.mins} min ${t.priority==='Urgente'?'· <b style="color:#b77d9c">Urgent</b>':''}</div></div></div>`}
function home(){let todayS=dateISO(today),todayTests=data.tests.filter(t=>t.date===todayS),todayTasks=data.tasks.filter(t=>t.due===todayS),sleep=data.sleep[0];let done=data.tasks.filter(t=>t.done).length,total=data.tasks.length;return `<div class="greeting"><div class="eyebrow">Mon espace quotidien</div><h2>Bonjour ✨</h2><p>Une journée à la fois, tu avances.</p></div><div class="card wide"><div class="section-title" style="margin-top:0"><h3>Mes cours du jour</h3><span class="tiny">Semaine ${weekForDate(today)}</span></div>${todayClassesHTML()}</div><div class="grid"><div class="card"><div class="stat-label">Sommeil de la nuit</div><div class="stat-value">${sleep?duration(sleep.mins):'—'}</div><div class="stat-note">${sleep?'Bien joué, prends soin de toi':'Ajoute tes horaires de sommeil'}</div></div><div class="card"><div class="stat-label">Mes tâches accomplies</div><div class="stat-value">${done} <span class="muted" style="font-size:15px">/ ${total}</span></div><div class="progress"><span style="width:${total?done/total*100:0}%"></span></div><div class="stat-note">Petit à petit 🌷</div></div><div class="card wide"><div class="section-title" style="margin-top:0"><h3>Ma journée</h3><span class="tiny">${dateFmt.format(today)}</span></div><div class="pill"><span class="dot"></span> ${todayTasks.length} devoir${todayTasks.length!==1?'s':''} à rendre aujourd’hui</div><div class="line"></div>${todayTasks.length?`<div class="list">${todayTasks.map(itemTask).join('')}</div>`:'<div class="empty">Aucun devoir à rendre aujourd’hui. Tu peux souffler !</div>'}<div class="line"></div><div class="section-title"><h3>Contrôles du jour</h3><span class="tiny">${todayTests.length}</span></div>${todayTests.length?`<div class="list">${todayTests.map(t=>`<div class="item"><div class="subject-dot" style="background:${subjectColor(t.subject)}"></div><div><div class="item-title">${esc(t.title)}</div><div class="item-meta">${esc(t.subject)}</div></div></div>`).join('')}</div>`:'<div class="empty">Pas de contrôle prévu aujourd’hui.</div>'}</div></div><div class="section-title"><h3>À venir</h3><button class="btn small" data-go="cours">Voir mes cours</button></div>${data.tests.filter(t=>t.date>=todayS).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3).length?`<div class="list">${data.tests.filter(t=>t.date>=todayS).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3).map(t=>`<div class="item"><div class="subject-dot" style="background:${subjectColor(t.subject)}"></div><div><div class="item-title">${esc(t.title)}</div><div class="item-meta">${esc(t.subject)} · ${dueLabel(t.date)}</div></div></div>`).join('')}</div>`:'<div class="empty">Tes prochains contrôles apparaîtront ici.</div>'}`}
function agenda(){let ds=dateISO(today),ev=data.events.filter(e=>e.date===ds).sort((a,b)=>(a.start||'').localeCompare(b.start||''));return `<div class="page-head"><h2>Agenda</h2><p>Ton planning scolaire et personnel, au même endroit.</p></div><div class="week-switch"><button data-week="A" class="${viewWeek==='A'?'active':''}">Semaine A</button><button data-week="B" class="${viewWeek==='B'?'active':''}">Semaine B</button></div><p class="week-caption">Cette semaine : ${weekForDate(today)} · Affichage : semaine ${viewWeek}</p><div class="schedule-days">${dayNames.map((name,i)=>{let list=timetableFor(i,viewWeek);return `<section class="schedule-day"><h3>${name}</h3><div class="class-list">${list.length?list.map(classRow).join(''):'<div class="schedule-empty">Aucun cours prévu</div>'}</div></section>`}).join('')}</div><div class="section-title"><h3>Événements personnels</h3><button class="btn small primary" id="addEvent">+ Événement</button></div>${ev.length?`<div class="list">${ev.map(e=>`<div class="item"><div class="subject-dot" style="background:${e.type==='Basket'?'#f2d9e6':'#e6e0f2'}"></div><div><div class="item-title">${esc(e.title)}</div><div class="item-meta">${esc(e.start||'')} ${e.end?'– '+esc(e.end):''} · ${esc(e.type)}</div></div></div>`).join('')}</div>`:'<div class="empty">Aucun événement aujourd’hui. Ajoute un rendez-vous, un entraînement ou un moment de révision.</div>'}<div class="section-title"><h3>À venir cette semaine</h3></div>${data.events.filter(e=>e.date>ds).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).length?`<div class="list">${data.events.filter(e=>e.date>ds).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(e=>`<div class="item"><div class="subject-dot" style="background:#e8e1f3"></div><div><div class="item-title">${esc(e.title)}</div><div class="item-meta">${dueLabel(e.date)} · ${esc(e.start||'')}</div></div></div>`).join('')}</div>`:'<div class="empty">Tes événements à venir s’afficheront ici.</div>'}`}

function cours(){let todayS=dateISO(today);return `<div class="page-head"><h2>Cours</h2><p>Devoirs, contrôles et notes, bien organisés.</p></div><div class="toolbar"><button class="btn primary" id="addTask">+ Devoir</button><button class="btn" id="addTest">+ Contrôle</button></div><div class="filters"><button class="filter active" data-filter="all">Tout</button><button class="filter" data-filter="task">Devoirs</button><button class="filter" data-filter="test">Contrôles</button><button class="filter" data-filter="urgent">Urgents</button></div><div id="coursList"></div><div class="section-title"><h3>Historique des contrôles</h3></div>${data.tests.filter(t=>t.date<todayS).length?`<div class="list">${data.tests.filter(t=>t.date<todayS).sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="item"><div class="subject-dot" style="background:${subjectColor(t.subject)}"></div><div style="flex:1"><div class="item-title">${esc(t.title)}</div><div class="item-meta">${esc(t.subject)} · ${dueLabel(t.date)}</div></div><button class="btn small" data-grade="${t.id}">${t.grade==null?'Ajouter note':esc(t.grade)+'/'+esc(t.max||20)}</button></div>`).join('')}</div>`:'<div class="empty">Les contrôles passés seront conservés ici.</div>'}`}
function renderCoursList(filter='all'){let list=document.getElementById('coursList');if(!list)return;let tasks=data.tasks.filter(t=>filter==='all'||filter==='task'||filter==='urgent').filter(t=>filter!=='urgent'||t.priority==='Urgente');let tests=data.tests.filter(t=>filter==='all'||filter==='test');let html='';if(tasks.length){html+=`<div class="section-title"><h3>Devoirs</h3><span class="tiny">${tasks.length}</span></div><div class="list">${tasks.sort((a,b)=>(a.done-b.done)||(a.due||'9999').localeCompare(b.due||'9999')||(a.priority==='Urgente'?-1:1)).map(itemTask).join('')}</div>`}if(tests.length){html+=`<div class="section-title"><h3>Contrôles à venir</h3><span class="tiny">${tests.length}</span></div><div class="list">${tests.filter(t=>t.date>=dateISO(today)).sort((a,b)=>a.date.localeCompare(b.date)).map(t=>`<div class="item"><div class="subject-dot" style="background:${subjectColor(t.subject)}"></div><div style="flex:1"><div class="item-title">${esc(t.title)}</div><div class="item-meta">${esc(t.subject)} · ${dueLabel(t.date)}</div></div></div>`).join('')||'<div class="empty">Aucun contrôle à venir.</div>'}</div>`}if(!html)html='<div class="empty">Rien ici pour le moment. Ajoute ton premier devoir ou contrôle !</div>';list.innerHTML=html;list.querySelectorAll('[data-task]').forEach(c=>c.onchange=()=>{let t=data.tasks.find(t=>t.id==c.dataset.task);if(t)t.done=c.checked;update()})}
function sport(){let ds=dateISO(today),list=data.sports.slice().sort((a,b)=>a.date.localeCompare(b.date));return `<div class="page-head"><h2>Sport</h2><p>Prépare ta semaine sportive et garde une trace de tes séances.</p></div><div class="card soft"><div class="stat-label">Cette semaine</div><div class="stat-value">${data.sports.filter(s=>{let d=new Date(s.date+'T12:00:00');let start=new Date(today);start.setDate(today.getDate()-((today.getDay()+6)%7));let end=new Date(start);end.setDate(start.getDate()+7);return d>=start&&d<end}).length} séances</div><div class="stat-note">Un rythme équilibré, à ton énergie.</div></div><div class="section-title"><h3>Mes séances</h3><button class="btn small primary" id="addSport">+ Séance</button></div>${list.length?`<div class="list">${list.map(s=>`<div class="item ${s.done?'done':''}"><input class="check" type="checkbox" data-sport="${s.id}" ${s.done?'checked':''}><div><div class="item-title">${esc(s.title)}</div><div class="item-meta">${dueLabel(s.date)} ${esc(s.time||'')} · ${s.mins} min</div></div></div>`).join('')}</div>`:'<div class="empty">Ajoute tes entraînements, matchs et séances personnelles.</div>'}`}
function sleep(){let last=data.sleep[0];return `<div class="page-head"><h2>Sommeil</h2><p>Un petit suivi pour mieux respecter ton rythme.</p></div><div class="card soft"><div class="stat-label">Dernière nuit</div><div class="metric">${last?duration(last.mins):'—'}</div><div class="stat-note">${last?`Couchée à ${esc(last.bed)} · Réveil à ${esc(last.wake)}`:'Note tes heures de coucher et de réveil.'}</div><div class="line"></div><button class="btn primary" id="addSleep">+ Noter mon sommeil</button></div><div class="section-title"><h3>Historique</h3></div>${data.sleep.length?`<div class="list">${data.sleep.slice(0,14).map(s=>`<div class="item"><div class="subject-dot" style="background:#e7e0f4"></div><div><div class="item-title">${dueLabel(s.date)} · ${duration(s.mins)}</div><div class="item-meta">${esc(s.bed)} → ${esc(s.wake)}</div></div></div>`).join('')}</div>`:'<div class="empty">Tes nuits enregistrées apparaîtront ici.</div>'}<p class="notice" style="margin-top:15px">Le suivi est là pour t’aider à observer ton rythme, sans pression sur un chiffre.</p>`}
function render(){let app=document.getElementById('app');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===data.tab));app.innerHTML=data.tab==='home'?home():data.tab==='agenda'?agenda():data.tab==='cours'?cours():data.tab==='sport'?sport():sleep();if(data.tab==='cours')renderCoursList();app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{data.tab=b.dataset.go;update()});let btn=(id,fn)=>{let el=document.getElementById(id);if(el)el.onclick=fn};btn('addTask',addTask);btn('addTest',addTest);btn('addEvent',addEvent);btn('addSport',addSport);btn('addSleep',addSleep);app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{app.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderCoursList(b.dataset.filter)});app.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>{viewWeek=b.dataset.week;render()});app.querySelectorAll('[data-task]').forEach(c=>c.onchange=()=>{let t=data.tasks.find(t=>t.id==c.dataset.task);if(t)t.done=c.checked;update()});app.querySelectorAll('[data-sport]').forEach(c=>c.onchange=()=>{let s=data.sports.find(s=>s.id==c.dataset.sport);if(s)s.done=c.checked;update()});app.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{let t=data.tests.find(t=>t.id==b.dataset.grade);openModal('Ajouter une note',field('Note obtenue','grade','number','min="0" step="0.25"')+field('Sur combien ?','max','number','min="1" step="1" value="20"')+field('Coefficient','coef','number','min="0.5" step="0.5" value="1"'),'Enregistrer',fd=>{t.grade=+fd.get('grade');t.max=+fd.get('max')||20;t.coef=+fd.get('coef')||1})})}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{data.tab=b.dataset.tab;update()});render();
</script>
</body>
</html>
